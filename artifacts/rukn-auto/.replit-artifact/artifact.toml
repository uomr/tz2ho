kind = "web"
previewPath = "/"
title = "RuknAuto — استخراج الفواتير"
version = "1.0.0"
id = "artifacts/rukn-auto"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19013

[services.development]
run = "pnpm --filter @workspace/rukn-auto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rukn-auto", "run", "build" ]
publicDir = "artifacts/rukn-auto/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19013"
BASE_PATH = "/"
